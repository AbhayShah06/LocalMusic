<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Join a LocalMusic Jam</title>
  <link rel="icon" type="image/png" href="localmusic-logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="queue.css">
</head>
<body>
  <main>
    <header>
      <img class="brandmark" src="localmusic-logo.png" alt="LocalMusic">
      <p class="eyebrow">LOCALMUSIC JAM</p>
      <h1>Pick the next song.</h1>
      <p class="lede">Search the host’s library and add directly to the room queue.</p>
    </header>

    <section id="setup" class="panel">
      <label for="room">ROOM CODE</label>
      <input id="room" maxlength="6" autocomplete="one-time-code" autocapitalize="characters" placeholder="ABC234">
      <label for="guest">YOUR NAME</label>
      <input id="guest" maxlength="28" autocomplete="name" placeholder="Name">
      <button id="join">Join Jam</button>
      <p id="setupError" class="error" role="alert"></p>
    </section>

    <section id="jam" hidden>
      <div class="roomline"><span id="liveDot"></span><strong id="roomLabel"></strong><button id="share">Share</button></div>
      <div class="searchbox"><input id="search" type="search" placeholder="Search any song or artist" autocomplete="off"><span id="resultCount"></span></div>
      <p id="searchStatus" class="searchStatus" aria-live="polite"></p>
      <div id="results" class="tracklist"></div>
      <aside class="playerDock">
        <div class="nowRow"><div class="nowArtwork" id="nowArtwork"><span>LM</span></div><div class="nowMeta"><small>NOW PLAYING</small><strong id="nowTitle">Waiting for music</strong><span id="nowArtist">The host controls playback</span></div><div class="nowPulse" id="nowPulse"></div></div>
        <div class="remoteControls">
          <button id="previous" class="transportControl" aria-label="Previous song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg></button>
          <button id="toggle" class="transportControl primaryControl" aria-label="Play"><svg class="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><svg class="pauseIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg></button>
          <button id="next" class="transportControl" aria-label="Next song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l9 6-9 6z"/></svg></button>
        </div>
        <details id="queueDetails"><summary><span>Full queue</span><span id="queueCount">0</span></summary><div id="queueList"></div></details>
      </aside>
      <p id="toast" role="status"></p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
