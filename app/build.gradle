plugins { id 'com.android.application' }
android {
    namespace 'com.abhayshah.localmusic'
    compileSdk 35
    defaultConfig {
        applicationId 'com.abhayshah.localmusic'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Media3 1.5.1 is the stable line built for compileSdk 35. Newer 1.11.x
    // artifacts require compileSdk 36 and a newer Android Gradle plugin.
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    testImplementation 'junit:junit:4.13.2'
}

