name: Security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            mode: manual
          - language: javascript-typescript
            mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.mode == 'manual'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        if: matrix.mode == 'manual'
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.mode }}
      - if: matrix.mode == 'manual'
        run: bash ./gradlew assemblePublicBuildDebug --no-daemon --max-workers=2 --console=plain
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac
        with:
          category: /language:${{ matrix.language }}
