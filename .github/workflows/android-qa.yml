name: Android QA
on:
  push:
    branches: [main]
    paths-ignore: [update.json, README.md]
  pull_request:
  workflow_dispatch:
    inputs:
      live_services:
        description: Test live catalog, background downloads and Jam
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: bash ./gradlew testPublicBuildDebugUnitTest lintPublicBuildDebug assemblePublicBuildDebug assemblePublicBuildDebugAndroidTest --max-workers=2 --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checks
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ./gradlew connectedPublicBuildDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.abhayshah.localmusic.FeatureRuntimeTest#a_realPlaybackQueueSeekShuffleRepeatAndRestore,com.abhayshah.localmusic.FeatureRuntimeTest#b_downloadIndexHistoryAndDailyMixPersist,com.abhayshah.localmusic.FeatureRuntimeTest#c_settingsAndPlaylistImportScreensActuallyOpen,com.abhayshah.localmusic.FeatureRuntimeTest#f_queueRefreshesDuringAutomaticTransitionAndIncomingAddition,com.abhayshah.localmusic.FeatureRuntimeTest#g_phonePlaylistsSongsAlbumsAndSourceSwitchKeepDownloadsVisible,com.abhayshah.localmusic.FeatureRuntimeTest#h_feedbackAndNotificationActionsDoNotTrapNavigation,com.abhayshah.localmusic.FeatureRuntimeTest#i_autoplayRefillsFiveKeepsOriginalSeedAndManualTracks,com.abhayshah.localmusic.FeatureRuntimeTest#j_mixPlaysExactlyItsPreviewAndSelectedSongsCanBeAdded,com.abhayshah.localmusic.FeatureRuntimeTest#k_homeRefreshAndBothDirectionsDismissSheets,com.abhayshah.localmusic.FeatureRuntimeTest#l_downloadedRecordingIsPreferredAcrossSourceIdsAndFormats,com.abhayshah.localmusic.FeatureRuntimeTest#n_githubUpdateBannerIsVisibleDismissibleAndNotDuplicated' --max-workers=2 --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: device-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
  live-services:
    if: github.event_name == 'workflow_dispatch' && inputs.live_services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash ./gradlew connectedPublicBuildDebugAndroidTest '-Pandroid.testInstrumentationRunnerArguments.class=com.abhayshah.localmusic.FeatureRuntimeTest#d_liveCatalogueSearchResolveAndAudioBytes,com.abhayshah.localmusic.FeatureRuntimeTest#e_backgroundDownloadWaitsOfflineDeduplicatesAndCompletes,com.abhayshah.localmusic.FeatureRuntimeTest#z_actualAndroidJamHostAndBrowserFriend,com.abhayshah.localmusic.FeatureRuntimeTest#m_liveSongMixAndLazyOnlinePlayback' --max-workers=2 --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-services
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
